[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10

; Commands run the installed `instinct` package (backend/src/instinct), so they
; do not depend on the working directory. The image must install the project
; (e.g. `uv sync`) for these to resolve.
;
; Set LOG_DIR in the image (e.g. /app/logs) when the package is installed
; non-editable: the default log location is only inferred from the source tree,
; and job_bot's !logs command reads the same LOG_FILE_PATH the logger writes.

[program:web_api]
command=python -m instinct.server
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web_api.log
stderr_logfile=/var/log/supervisor/web_api_error.log
environment=PYTHONUNBUFFERED=1

[program:scraper_rotation]
command=python -m instinct.tools.scraper_rotation
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scraper.log
stderr_logfile=/var/log/supervisor/scraper_error.log
environment=PYTHONUNBUFFERED=1

[program:discord_bot]
command=python -m instinct.tools.discord_bot
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/discord.log
stderr_logfile=/var/log/supervisor/discord_error.log
environment=PYTHONUNBUFFERED=1