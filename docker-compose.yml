version: "3.9"

# Note on REDIS_URL override: services define REDIS_URL=${REDIS_URL:-redis://redis:6379}
# in environment, which takes precedence over env_file: backend/.env. To use an external
# Redis, either: (1) export REDIS_URL in your shell before docker compose up, or
# (2) remove the REDIS_URL line from each service and set it in backend/.env.

services:
  redis:
    image: redis:7-alpine
    container_name: instinct-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - instinct-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile.web
    entrypoint: /entrypoint.sh
    command: python server.py
    env_file: backend/.env
    environment:
      - PORT=8000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "8000:8000"
    networks:
      - instinct-net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: backend/Dockerfile.scraper
    entrypoint: /entrypoint.sh
    command: python app/tools/scraper_rotation.py
    env_file: backend/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    networks:
      - instinct-net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  discord:
    build:
      context: .
      dockerfile: backend/Dockerfile.discord
    entrypoint: /entrypoint.sh
    command: python app/tools/discord_bot.py
    env_file: backend/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    networks:
      - instinct-net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

networks:
  instinct-net:

volumes:
  redis-data:
