[project]
name = "instinct"
version = "0.1.0"
description = "Instinct — UCI Club Discovery Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "boto3",
    "discord.py",
    "email-validator",
    "fastapi",
    "httpx",
    "ics",
    "openai",
    "pillow",
    "psutil",
    "pydantic",
    "python-dateutil",
    "python-dotenv",
    "pytz",
    "redis",
    "requests",
    "schedule",
    "selenium",
    "supabase",
    "typing-extensions",
    "uvicorn",
    "webdriver-manager",
]

[project.optional-dependencies]
discord = [
    "matplotlib",
    "numpy",
]
discordbot = [
    "matplotlib",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/instinct"]
