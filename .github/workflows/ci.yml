name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Postgres major must match major_version in supabase/config.toml; pgvector 0.8.0 matches the live project.
      DB_IMAGE: pgvector/pgvector:0.8.0-pg15
    steps:
      - uses: actions/checkout@v7
      - name: Apply stub, migrations and seed to a fresh database
        run: scripts/db-local.sh reset
      - name: Sanity check
        # One known seed row. Its content_vector is filled by the seed's last
        # statement, so a non-null value means the whole seed applied.
        run: |
          row=$(docker exec -e PGPASSWORD=postgres instinct-db \
            psql -X -h 127.0.0.1 -U postgres -tAc \
            "select name, content_vector is not null from public.clubs where instagram_handle = 'example_chess_club'")
          echo "example_chess_club: ${row:-<missing>}"
          test "$row" = "Example Chess Club|t"
      - name: Club search check
        # Runs search_clubs_paginated against the seed; rolls back.
        run: |
          docker exec -i -e PGPASSWORD=postgres instinct-db \
            psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -o /dev/null \
            < scripts/db-search-check.sql
