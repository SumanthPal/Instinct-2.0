name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  db-migrations:
    runs-on: ubuntu-latest
    env:
      DB_IMAGE: pgvector/pgvector:pg15
    steps:
      - uses: actions/checkout@v7
      - name: Apply stub, migrations and seed to a fresh database
        run: scripts/db-local.sh reset
      - name: Sanity check
        run: |
          clubs=$(docker exec -e PGPASSWORD=postgres instinct-db \
            psql -X -h 127.0.0.1 -U postgres -tAc 'select count(*) from public.clubs')
          echo "public.clubs rows: $clubs"
          test "$clubs" -gt 0
